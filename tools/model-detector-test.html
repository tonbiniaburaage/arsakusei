<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Resin model detector test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #17213b; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccd4e8; padding: 8px 12px; text-align: left; }
    .pass { color: #08783f; font-weight: 700; }
    .fail { color: #b42318; font-weight: 700; }
  </style>
</head>
<body data-status="running">
  <h1>Resin model detector test</h1>
  <table>
    <thead><tr><th>Model</th><th>Normal</th><th>Dark 24%</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <p id="summary">Running…</p>
  <script type="module">
    import { ResinModelDetector } from '../src/resin-model-detector.js?v=20261010-ipad-models3';
    import { qualityProfile } from '../src/creature-config.js?v=20261010-ipad-models3';

    const sources = {
      jellyfish: '../assets/targets/resin-jellyfish-reference.png',
      whale: '../assets/targets/resin-whale-reference.png',
      turtle: '../assets/targets/resin-turtle-reference.png'
    };
    const crops = {
      jellyfish: { x: 0.17, y: 0.1, width: 0.66, height: 0.78 },
      whale: { x: 0.02, y: 0.1, width: 0.88, height: 0.58 },
      turtle: { x: 0.1, y: 0.2, width: 0.72, height: 0.64 }
    };
    const detector = new ResinModelDetector();
    await detector.initialize();
    const canvas = document.createElement('canvas');
    canvas.width = 192;
    canvas.height = 144;
    const context = canvas.getContext('2d', { willReadFrequently: true });
    const rows = [];

    for (const [expected, src] of Object.entries(sources)) {
      const image = await loadImage(src);
      const normal = analyze(renderCameraFrame(image, crops[expected], 1, false));
      const dark = analyze(renderCameraFrame(image, crops[expected], 0.24, true));
      rows.push({ expected, normal, dark });
    }

    const profile = qualityProfile();
    window.__detectorDiagnostics = rows;
    const recognitionPassed = rows.every(({ expected, normal, dark }) => normal.key === expected && dark.key === expected);
    detector.reset();
    const motionSample = { key: 'whale', confidence: 0.75, x: 0.3, y: 0.55, coverage: 0.03 };
    const motionResults = [1, 2, 3].map(() => detector.stabilize(motionSample));
    const responsePassed = motionResults[0] === null
      && motionResults[1] === null
      && motionResults[2]?.key === 'whale'
      && detector.intervalSeconds <= 0.11;
    const profilePassed = profile.mode === 'ipad-mini-6-kiosk'
      && profile.lightweight === false
      && profile.lowPower === false
      && profile.maxFPS === 30;
    const passed = recognitionPassed && responsePassed && profilePassed;
    document.querySelector('#results').innerHTML = rows.map(({ expected, normal, dark }) => `
      <tr>
        <th>${expected}</th>
        <td class="${normal.key === expected ? 'pass' : 'fail'}">${normal.key || 'no match'}<br><small>${normal.debug}</small></td>
        <td class="${dark.key === expected ? 'pass' : 'fail'}">${dark.key || 'no match'}<br><small>${dark.debug}</small></td>
      </tr>
    `).join('');
    document.querySelector('#summary').textContent = passed
      ? 'PASS — 3 models, dark-scene compensation, handheld response, and iPad kiosk profile'
      : `FAIL — profile=${JSON.stringify(profile)}`;
    document.querySelector('#summary').className = passed ? 'pass' : 'fail';
    document.body.dataset.status = passed ? 'pass' : 'fail';

    function analyze(descriptor) {
      if (!descriptor) return { key: null, debug: 'no descriptor' };
      const scores = detector.rank(descriptor);
      const result = detector.classify(descriptor);
      return {
        key: result?.key || null,
        debug: JSON.stringify({
          aspect: descriptor.aspect.toFixed(3),
          fill: descriptor.fill.toFixed(3),
          lower: descriptor.lowerRatio.toFixed(3),
          coverage: descriptor.coverage.toFixed(3),
          scores: scores.map(({ key, score }) => [key, score.toFixed(3)])
        })
      };
    }

    function renderCameraFrame(image, crop, brightness, mirror) {
      context.save();
      context.fillStyle = '#62482f';
      context.fillRect(0, 0, canvas.width, canvas.height);
      const sourceX = image.naturalWidth * crop.x;
      const sourceY = image.naturalHeight * crop.y;
      const sourceWidth = image.naturalWidth * crop.width;
      const sourceHeight = image.naturalHeight * crop.height;
      const scale = Math.min(canvas.width * 0.72 / sourceWidth, canvas.height * 0.82 / sourceHeight);
      const width = sourceWidth * scale;
      const height = sourceHeight * scale;
      const x = (canvas.width - width) * 0.5;
      const y = (canvas.height - height) * 0.5;
      if (mirror) {
        context.translate(canvas.width, 0);
        context.scale(-1, 1);
      }
      context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
      context.restore();
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      if (brightness !== 1) {
        for (let index = 0; index < imageData.data.length; index += 4) {
          imageData.data[index] *= brightness;
          imageData.data[index + 1] *= brightness;
          imageData.data[index + 2] *= brightness;
        }
      }
      return detector.describe(imageData);
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }
  </script>
</body>
</html>
