<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../">
  <title>Marker game start test</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="effects"></canvas>
  <div id="game-controls"></div>
  <pre id="result">testing...</pre>
  <script type="module">
    import * as THREE from 'three';
    import { EffectController } from './src/effect-controller.js?v=20261010-marker-images5';
    import { CreatureController } from './src/creature-controller.js?v=20261010-marker-images5';
    import { CREATURES } from './src/creature-config.js?v=20261010-marker-images5';

    const canvas = document.querySelector('#effects');
    const result = document.querySelector('#result');
    const effects = new EffectController(canvas, { pixelRatio: 1, spawnRate: 0, maxParticles: 0 });
    effects.connect(new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100), []);

    const expected = {
      jellyfish: 'jelly-rhythm',
      whale: 'whale-charge',
      turtle: 'turtle-polish'
    };
    const checks = [];
    for (const [key, phase] of Object.entries(expected)) {
      effects.reset();
      const world = new THREE.Group();
      world.position.z = -4;
      const controller = new CreatureController(world, CREATURES[key], { worldScale: 0.8 });
      await controller.load();
      effects.connect(effects.camera, [{ key, controller, rough: true }]);
      effects.setMarkerAnchor(key, CREATURES[key], { x: 0.12, y: 0.84, coverage: 0.02 });
      effects.setActive(key);
      effects.update(1.05);
      const centered = effects.gameAnchor.x === innerWidth / 2 && effects.gameAnchor.y === innerHeight / 2;
      const imageVisible = effects.getMarkerCreatureImage() === controller.getEffectSources()[0].material.map.image;
      checks.push({
        key,
        expected: phase,
        actual: effects.game.phase,
        centered,
        imageVisible,
        passed: effects.game.phase === phase && centered && imageVisible
      });
    }
    const passed = checks.every((check) => check.passed);
    result.dataset.passed = String(passed);
    result.textContent = JSON.stringify({ passed, checks }, null, 2);
    document.title = passed ? 'PASS: marker game start' : 'FAIL: marker game start';
  </script>
</body>
</html>
