<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090616">
  <title>ドリーミー海のなかま AR</title>
  <link rel="stylesheet" href="./styles.css?v=20260729-stabledemo2">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <video id="camera" autoplay playsinline muted aria-label="カメラ映像" hidden></video>
    <div id="stage" aria-hidden="true"></div>
    <canvas id="effects" aria-hidden="true"></canvas>
    <div id="game-controls" class="game-controls" aria-label="海のなかまミニゲーム"></div>

    <header class="hud">
      <p class="eyebrow">DREAMY OCEAN</p>
      <h1>海のなかま AR</h1>
      <p id="status" role="status">光る模型にスマホを向けて、海の光を集めよう！</p>
    </header>

    <section id="welcome" class="welcome">
      <div class="welcome__icon" aria-hidden="true">✦</div>
      <h2>模型から海のなかまが飛び出すよ</h2>
      <p>光る模型にスマホを向けて、海の光を集めよう！</p>
      <button id="start-button" class="primary-button">タップしてカメラを起動</button>
      <div class="demo-row">
        <button id="demo-button" class="secondary-button demo-button">3種類のデモを見る</button>
      </div>
      <p class="privacy-note">カメラ映像は端末内だけで使われ、送信されません。</p>
    </section>

    <div id="tracking-guide" class="tracking-guide" hidden>
      <span class="tracking-guide__corner tracking-guide__corner--tl"></span>
      <span class="tracking-guide__corner tracking-guide__corner--tr"></span>
      <span class="tracking-guide__corner tracking-guide__corner--bl"></span>
      <span class="tracking-guide__corner tracking-guide__corner--br"></span>
      <p>光る模型にスマホを向けて、海の光を集めよう！</p>
    </div>

    <div id="active-creature" class="active-creature" hidden></div>
    <div id="phase-badge" class="phase-badge" hidden>Phase 7 · 展示版</div>

    <button id="photo-button" class="photo-button" aria-label="AR写真を撮る" hidden disabled>
      <span class="photo-button__lens"></span>
    </button>
    <button id="reset-button" class="icon-button icon-button--right reset-button" aria-label="ゲームをやり直す" hidden>
      <span class="reset-button__icon" aria-hidden="true">↻</span>
      <span class="reset-button__label">やり直し</span>
    </button>

    <div id="capture-countdown" class="capture-countdown" hidden aria-live="assertive">✦</div>
    <div id="capture-flash" class="capture-flash" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" hidden></div>

    <section id="photo-preview" class="photo-preview" hidden aria-label="撮影したAR写真">
      <div class="photo-preview__panel">
        <h2>AR写真が撮れました</h2>
        <img id="photo-image" alt="撮影したAR写真">
        <div class="photo-preview__actions">
          <button id="photo-save" class="primary-button">共有・保存</button>
          <button id="photo-close" class="secondary-button">閉じる</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.js?v=20260801-stable-v12"></script>
</body>
</html>
