<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03172c">
  <title>DREAMY OCEAN — 光る海の水族館</title>
  <link rel="stylesheet" href="./styles.css?v=20261004-interactions2">
</head>
<body>
  <main id="app" class="is-starting">
    <video id="camera" autoplay playsinline muted aria-label="展示カメラの映像"></video>
    <div class="ocean-color" aria-hidden="true"></div>
    <canvas id="ocean" aria-hidden="true"></canvas>

    <section id="gesture-guide" class="gesture-guide" aria-live="polite">
      <div class="gesture-guide__copy">
        <span>GESTURE HINT</span>
        <p id="gesture-label">手をかざしてみよう</p>
        <small>集める・振って流す・大きく回す・両手でチャージ</small>
      </div>
      <div id="gesture-progress" class="gesture-guide__progress" aria-hidden="true"><i></i></div>
    </section>

    <header class="title-card">
      <p>DREAMY OCEAN</p>
      <h1>光る海の水族館</h1>
      <span id="status" role="status">海の光を準備中…</span>
    </header>

    <section id="setup" class="setup" aria-labelledby="setup-title">
      <div class="setup__orb" aria-hidden="true">✶</div>
      <p class="setup__eyebrow">CAMERA SETUP</p>
      <h2 id="setup-title">カメラを起動します</h2>
      <p id="setup-message">カメラへのアクセスを許可すると、現実の景色が水中世界に変わります。</p>
      <button id="camera-button" type="button">カメラを起動</button>
      <button id="fullscreen-button" class="secondary" type="button">全画面で表示</button>
      <small>映像はこのPC内だけで使用し、保存・送信しません。</small>
    </section>

    <div class="interaction-hint" aria-hidden="true">
      <span class="interaction-hint__light"></span>
      <p>手を動かすと、魚たちと海の流れが変わるよ</p>
    </div>
  </main>

  <script type="module" src="./src/main.js?v=20261004-interactions2"></script>
</body>
</html>
