<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幻想クラゲ PNG連番 AR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050719;font-family:system-ui,-apple-system,sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#050719}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#guide{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .35s}
#frame{width:min(70vw,330px);height:min(70vw,330px);border:1.5px solid rgba(236,240,255,.85);border-radius:43%;box-shadow:0 0 0 9999px rgba(3,6,24,.16),0 0 28px rgba(165,183,255,.55)}
#status{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;background:rgba(4,7,26,.62);backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.14);padding:9px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
#controls{position:fixed;z-index:5;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:999px;padding:13px 18px;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#start{background:#fff;color:#19172f}
#demo{display:none;background:rgba(112,91,226,.94);color:#fff}
#meter{position:fixed;z-index:5;left:50%;bottom:84px;transform:translateX(-50%);width:min(70vw,320px);height:6px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22)}
#meterFill{width:0;height:100%;background:linear-gradient(90deg,#aaa7ff,#efeaff);transition:width .1s}
#note{position:fixed;z-index:5;left:12px;right:12px;bottom:108px;color:rgba(255,255,255,.9);font-size:12px;text-align:center;text-shadow:0 1px 5px #000}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<canvas id="fx"></canvas>
<div id="guide"><div id="frame"></div></div>
<div id="status">「開始」を押してカメラを許可</div>
<div id="meter"><div id="meterFill"></div></div>
<div id="note">紫色のレジンクラゲを枠の中央に入れてください</div>
<div id="controls">
<button id="start">開始</button>
<button id="demo">手動で演出</button>
</div>

<script>
const SHEETS=["jelly_sheet_00.png", "jelly_sheet_01.png", "jelly_sheet_02.png", "jelly_sheet_03.png", "jelly_sheet_04.png", "jelly_sheet_05.png"];
const FRAME_W=576, FRAME_H=384, COLS=4, ROWS=3;
const FRAME_COUNT=71, SOURCE_FPS=12;

const cameraVideo=document.getElementById("camera");
const canvas=document.getElementById("fx");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");
const startBtn=document.getElementById("start");
const demoBtn=document.getElementById("demo");
const guide=document.getElementById("guide");
const meterFill=document.getElementById("meterFill");

let dpr=Math.min(devicePixelRatio||1,1.5);
function resize(){
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener("resize",resize);

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const rand=(a,b)=>a+Math.random()*(b-a);

const sheets=[];
let loaded=0;
SHEETS.forEach((name,i)=>{
  const img=new Image();
  img.src="assets/"+name;
  img.onload=()=>{ loaded++; if(loaded===SHEETS.length) statusEl.textContent="素材の準備ができました"; };
  sheets[i]=img;
});

let active=false, startedAt=0, cooldownUntil=0, particles=[];

function resetParticles(){
  particles=[];
  for(let i=0;i<72;i++) particles.push({
    angle:rand(0,Math.PI*2),radius:rand(12,170),speed:rand(.25,1.2),
    size:rand(1,4),phase:rand(0,Math.PI*2)
  });
}

function drawFrame(frameIndex,x,y,w,rotation,alpha,maskRadius){
  const sheetIndex=Math.floor(frameIndex/(COLS*ROWS));
  const local=frameIndex%(COLS*ROWS);
  const sx=(local%COLS)*FRAME_W;
  const sy=Math.floor(local/COLS)*FRAME_H;
  const img=sheets[sheetIndex];
  if(!img || !img.complete) return;

  const h=w*(FRAME_H/FRAME_W);
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rotation);
  ctx.beginPath();
  ctx.ellipse(0,0,maskRadius,maskRadius*.78,0,0,Math.PI*2);
  ctx.clip();
  ctx.globalAlpha=alpha;
  ctx.globalCompositeOperation="screen";
  ctx.drawImage(img,sx,sy,FRAME_W,FRAME_H,-w/2,-h/2,w,h);
  ctx.restore();
}

function drawGlow(cx,cy,r,alpha){
  ctx.save(); ctx.globalCompositeOperation="screen";
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,`rgba(205,218,255,${.34*alpha})`);
  g.addColorStop(.4,`rgba(117,128,255,${.18*alpha})`);
  g.addColorStop(1,"rgba(80,70,255,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawParticles(elapsed,p,alpha){
  const cx=innerWidth*.5, cy=innerHeight*.6;
  const outward=p<.52?ease(p/.52):1-ease((p-.52)/.48);
  ctx.save(); ctx.globalCompositeOperation="screen";
  particles.forEach((pt,i)=>{
    const r=pt.radius*outward;
    const a=pt.angle+elapsed*pt.speed*.22;
    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r*.62-Math.sin(elapsed*1.6+pt.phase)*7;
    const tw=.35+.65*(.5+.5*Math.sin(elapsed*3+pt.phase));
    ctx.fillStyle=`rgba(${i%3===0?205:150},${i%3===1?220:170},255,${.58*tw*alpha})`;
    ctx.beginPath(); ctx.arc(x,y,pt.size,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

function drawScene(elapsed){
  const total=9.2;
  const p=clamp(elapsed/total,0,1);
  const cx=innerWidth*.5, cy=innerHeight*.6;
  const alpha=Math.min(clamp(elapsed/.45,0,1),clamp((total-elapsed)/.65,0,1));

  let x,y,scale,rotation,maskRadius;
  if(elapsed<1.35){
    const q=ease(elapsed/1.35);
    x=lerp(cx,innerWidth*.53,q); y=lerp(cy,innerHeight*.43,q);
    scale=lerp(.04,.78,q); rotation=lerp(.20,-.03,q);
    maskRadius=lerp(8,Math.min(innerWidth,innerHeight)*.53,q);
  }else if(elapsed<6.75){
    const q=(elapsed-1.35)/5.4;
    x=innerWidth*(.53+.09*Math.sin(q*Math.PI*1.1));
    y=innerHeight*(.42-.14*Math.sin(q*Math.PI));
    scale=.78+.09*Math.sin(q*Math.PI);
    rotation=-.03+.06*Math.sin(q*Math.PI*2);
    maskRadius=Math.min(innerWidth,innerHeight)*.59;
  }else{
    const q=ease((elapsed-6.75)/2.45);
    x=lerp(innerWidth*.57,cx,q); y=lerp(innerHeight*.39,cy,q);
    scale=lerp(.78,.018,q); rotation=lerp(.02,-.22,q);
    maskRadius=lerp(Math.min(innerWidth,innerHeight)*.59,5,q);
  }

  drawGlow(cx,cy,Math.min(innerWidth,innerHeight)*(.20+.19*Math.sin(Math.PI*p)),alpha);
  drawParticles(elapsed,p,alpha);

  // 5.9秒の素材を9.2秒の演出に合わせて循環・減速再生
  const sourceTime=(elapsed<6.75 ? elapsed*.78 : (6.75-elapsed*.20));
  let frameIndex=Math.floor(Math.abs(sourceTime)*SOURCE_FPS)%FRAME_COUNT;
  drawFrame(frameIndex,x,y,innerWidth*scale,rotation,alpha,maskRadius);

  // 模型へ出入りする光輪
  const ringAlpha=(elapsed<1.6?1-clamp(elapsed/1.6,0,1):clamp((elapsed-6.5)/2.7,0,1))*alpha;
  ctx.save(); ctx.globalCompositeOperation="screen";
  for(let i=0;i<3;i++){
    const rr=23+i*12+Math.sin(elapsed*3+i)*3;
    ctx.strokeStyle=`rgba(188,214,255,${(.34-i*.07)*ringAlpha})`;
    ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(cx,cy+25,rr,rr*.3,0,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  if(elapsed>=total) finish();
}

function trigger(){
  if(active||performance.now()<cooldownUntil||loaded<SHEETS.length) return;
  active=true; startedAt=performance.now(); resetParticles();
  guide.style.opacity=".08";
  statusEl.textContent="クラゲが模型から生まれています…";
}

function finish(){
  active=false; guide.style.opacity="1";
  statusEl.textContent="クラゲを枠の中央に入れてください";
  cooldownUntil=performance.now()+1300;
}

function render(now){
  requestAnimationFrame(render);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(active) drawScene((now-startedAt)/1000);
}
requestAnimationFrame(render);

// 紫色の簡易認識
const detectCanvas=document.createElement("canvas");
detectCanvas.width=96; detectCanvas.height=96;
const dctx=detectCanvas.getContext("2d",{willReadFrequently:true});
let hold=0;

function detectPurple(){
  if(cameraVideo.readyState<2||active) return;
  const vw=cameraVideo.videoWidth,vh=cameraVideo.videoHeight;
  dctx.drawImage(cameraVideo,vw*.28,vh*.28,vw*.44,vh*.44,0,0,96,96);
  const data=dctx.getImageData(0,0,96,96).data;
  let purple=0,usable=0;
  for(let i=0;i<data.length;i+=16){
    const r=data[i],g=data[i+1],b=data[i+2];
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(mx>45) usable++;
    if(b>g*1.03&&r>g*.91&&b>72&&(mx-mn)>10) purple++;
  }
  const ratio=usable?purple/usable:0;
  meterFill.style.width=(clamp((ratio-.035)/.12,0,1)*100).toFixed(0)+"%";
  if(ratio>.09) hold++; else hold=Math.max(0,hold-2);
  if(hold>3){hold=0;trigger();}
}
setInterval(detectPurple,140);

startBtn.addEventListener("click",async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    cameraVideo.srcObject=stream; await cameraVideo.play();
    startBtn.style.display="none"; demoBtn.style.display="inline-block";
    statusEl.textContent=loaded===SHEETS.length?"クラゲを枠の中央に入れてください":"素材を読み込み中…";
  }catch(e){
    statusEl.textContent="カメラを開始できません";
    alert("HTTPS上で開き、カメラ利用を許可してください。");
  }
});
demoBtn.addEventListener("click",trigger);
</script>
</body>
</html>
