<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090616">
  <title>ドリーミー海のなかま AR</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <video id="camera" autoplay playsinline muted aria-label="カメラ映像" hidden></video>
    <div id="stage" aria-hidden="true"></div>

    <header class="hud">
      <p class="eyebrow">DREAMY OCEAN</p>
      <h1>海のなかま AR</h1>
      <p id="status" role="status">「ARをはじめる」を押してください</p>
    </header>

    <section id="welcome" class="welcome">
      <div class="welcome__icon" aria-hidden="true">✦</div>
      <h2>作品をカメラに映してみよう</h2>
      <p>カメラを許可すると、海のなかまが飛び出します。</p>
      <button id="start-button" class="primary-button">ARをはじめる</button>
      <button id="demo-button" class="text-button">カメラなしで5匹の動きを見る</button>
      <a class="target-link" href="./target-card.html" target="_blank" rel="noopener">テスト用カードを表示・印刷</a>
      <p class="privacy-note">映像は端末内だけで使われ、送信されません。</p>
    </section>

    <div id="tracking-guide" class="tracking-guide" hidden>
      <span class="tracking-guide__corner tracking-guide__corner--tl"></span>
      <span class="tracking-guide__corner tracking-guide__corner--tr"></span>
      <span class="tracking-guide__corner tracking-guide__corner--bl"></span>
      <span class="tracking-guide__corner tracking-guide__corner--br"></span>
      <p>テスト用カードを枠の中に映してください</p>
    </div>
    <div id="phase-badge" class="phase-badge" hidden>Phase 3 · 画像追跡 + 5匹</div>
    <button id="reset-button" class="icon-button icon-button--right" aria-label="3Dモデルを元の位置に戻す" hidden>↻</button>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
