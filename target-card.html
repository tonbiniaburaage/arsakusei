<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phase 2 テスト用カード</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; color: #21163a; background: #f5f1ff; }
    body { margin: 0; padding: 32px 18px; text-align: center; }
    main { max-width: 720px; margin: auto; }
    h1 { font-size: 24px; }
    p { line-height: 1.7; }
    img { display: block; width: min(92vw, 560px); margin: 24px auto; box-shadow: 0 14px 45px #37295a33; }
    a { display: inline-block; padding: 12px 18px; border-radius: 999px; color: white; background: #6c52b8; font-weight: 700; text-decoration: none; }
    @media print {
      a, .screen-only { display: none; }
      body { padding: 0; background: white; }
      img { width: 16cm; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Phase 2 テスト用カード</h1>
    <p class="screen-only">この画面を別の端末に表示するか、印刷してください。AR画面の枠内にカード全体を映すと、5匹のクラゲがカードを基準に固定されます。</p>
    <img src="./assets/targets/demo-card.png" alt="MindAR公式のテスト用画像ターゲット">
    <a href="./assets/targets/demo-card.png" download>画像を保存</a>
  </main>
</body>
</html>
